# Deploy

name: Deploy

on:
  pull_request:
    branches: [master]
    paths: [infra/**, lambda/**, web/**, .github/workflows/**]
  push:
    branches: [master]
    paths: [infra/**, lambda/**, web/**, .github/workflows/**]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write # REQUIRED for OIDC
  contents: read

env:
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_app_name: todo-app
  # Terraform downloads providers here; the cache step below persists it so the
  # aws/cloudflare plugins aren't re-downloaded (hundreds of MB) every run.
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  # Security: static analysis of the Terraform for misconfigurations. Trivy is
  # the maintained successor to tfsec (same rules engine). Blocks on HIGH/
  # CRITICAL findings; suppressions with rationale live in infra/.trivyignore.
  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1" # fail the job on any finding at these severities
          trivyignores: infra/.trivyignore

  # Single job: plan and (conditionally) apply run on the SAME runner. This is
  # required because the Lambda zip is built on disk by Terraform's archive_file
  # during plan — a separate apply job on a fresh runner would not have that file
  # (it is gitignored, so it isn't in the checkout or a plan artifact either).
  #
  # PRs / dispatch-plan stop after Plan (read-only). Push to master or an explicit
  # apply dispatch continue to Apply, which is gated on the `production`
  # environment (required reviewers).
  deploy:
    name: Terraform
    needs: security # don't plan/apply if the security scan fails
    runs-on: ubuntu-latest
    # The environment gate only needs to fire when we will apply.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')) && 'production' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      # Cache the downloaded provider plugins, keyed on the lockfile so it
      # invalidates when provider versions change. The dir must exist before init
      # writes to it.
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugins-

      - name: Init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate
        run: terraform -chdir=infra validate

      # Plan always runs (this is the read-only step PRs stop at). archive_file
      # builds the Lambda zip here, on this runner.
      - name: Plan
        run: terraform -chdir=infra plan -out=tfplan

      # Apply the saved plan — same runner, so the zip built during Plan is
      # present. Runs only on push-to-master or an explicit apply dispatch.
      - name: Apply
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform -chdir=infra apply -auto-approve tfplan
