# Destroy: manual teardown of the infrastructure.

name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  destroy:
    name: Destroy infrastructure
    runs-on: ubuntu-latest
    environment: production # approval gate on teardown too
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'destroy'
        run: |
          echo "Confirmation string did not match 'destroy'. Aborting." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Empty frontend bucket
        continue-on-error: true
        run: |
          BUCKET=$(terraform -chdir=infra output -raw web_bucket_id) || exit 0
          aws s3 rm "s3://${BUCKET}/" --recursive

      - name: Destroy
        run: terraform -chdir=infra destroy -auto-approve -var-file=dev.tfvars
