<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    .priority-high { border-left: 4px solid #dc3545; }
    .priority-medium { border-left: 4px solid #ffc107; }
    .priority-low { border-left: 4px solid #198754; }
    .status-completed { opacity: 0.7; }
    .status-completed .task-text { text-decoration: line-through; }
    .todo-card { transition: all 0.3s ease; }
    .todo-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
    .loading, .error { text-align: center; padding: 2rem; }
    .error { color: #dc3545; }
  </style>
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-10 mx-auto">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fas fa-tasks me-2"></i> Todo List</h2>
            <div class="d-flex gap-2">
              <button class="btn btn-light btn-sm" onclick="location.href='create.html'">
                <i class="fas fa-plus me-2"></i> New Task
              </button>
              <button class="btn btn-outline-light btn-sm" id="signOutBtn">
                <i class="fas fa-sign-out-alt me-1"></i> Sign out
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="loading" class="loading">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2">Loading your tasks...</p>
            </div>

            <div id="error" class="error d-none">
              <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
              <p>Unable to load tasks. Please try again later.</p>
              <button class="btn btn-primary" onclick="loadTodos()">
                <i class="fas fa-redo me-2"></i>Retry
              </button>
            </div>

            <div id="todo-container" class="d-none">
              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search tasks..." />
                  </div>
                </div>
                <div class="col-md-6">
                  <select id="filterStatus" class="form-select">
                    <option value="all">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                  </select>
                </div>
              </div>

              <div id="task-count" class="mb-3">
                <span class="badge bg-secondary">0 tasks</span>
              </div>

              <div id="todo-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h5 class="modal-title">Edit Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label class="form-label">Task Name</label>
              <input type="text" class="form-control" id="editName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Priority</label>
              <select class="form-select" id="editPriority">
                <option>High</option><option>Medium</option><option>Low</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="editStatus">
                <option>Pending</option><option>In Progress</option><option>Completed</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Due Date</label>
              <input type="date" class="form-control" id="editDueDate" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Are you sure you want to delete this task?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    let allTodos = [];
    let selectedTaskIdToDelete = null;

    document.getElementById("signOutBtn").addEventListener("click", () => Auth.signOut());

    async function loadTodos() {
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const container = document.getElementById("todo-container");

      loading.classList.remove("d-none");
      error.classList.add("d-none");
      container.classList.add("d-none");

      try {
        const response = await apiFetch("/items");
        if (!response.ok) throw new Error("Failed to fetch todos");

        const data = await response.json();
        if (Array.isArray(data.data)) {
          allTodos = data.data;
          displayTodos(allTodos);
          updateTaskCount(allTodos.length);
          loading.classList.add("d-none");
          container.classList.remove("d-none");
        } else {
          throw new Error("Invalid API response");
        }
      } catch (err) {
        console.error("Error loading todos:", err);
        loading.classList.add("d-none");
        error.classList.remove("d-none");
      }
    }

    function displayTodos(todos) {
      const todoList = document.getElementById("todo-list");
      if (todos.length === 0) {
        todoList.innerHTML = `
          <div class="text-center py-5">
            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">No tasks found</h5>
          </div>`;
        return;
      }

      todoList.innerHTML = todos.map(todo => {
        const priorityClass = `priority-${todo.task_priority.toLowerCase()}`;
        const statusClass = todo.task_status === 'Completed' ? 'status-completed' : '';
        return `
          <div class="card todo-card mb-3 ${priorityClass} ${statusClass}">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-8">
                  <h5 class="card-title task-text mb-1">${escapeHtml(todo.task_name)}</h5>
                  <div class="d-flex align-items-center gap-3">
                    <span class="badge ${getStatusBadgeClass(todo.task_status)}">
                      ${getStatusIcon(todo.task_status)} ${todo.task_status}
                    </span>
                    <span class="badge ${getPriorityBadgeClass(todo.task_priority)}">
                      ${getPriorityIcon(todo.task_priority)} ${todo.task_priority}
                    </span>
                  </div>
                </div>
                <div class="col-md-4 text-md-end">
                  ${todo.due_date ? `<small class="text-muted"><i class="fas fa-calendar-alt me-1"></i>Due: ${formatDate(todo.due_date)}</small>` : ''}
                  <div class="mt-2 d-flex gap-2 justify-content-md-end">
                    <button class="btn btn-outline-primary btn-sm" onclick="openEdit('${todo.id}')">
                      <i class="fas fa-pen"></i> Edit
                    </button>
                    <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete('${todo.id}')">
                      <i class="fas fa-trash-alt"></i> Delete
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
      }).join("");
    }

    // --- Edit (PUT) ---
    function openEdit(id) {
      const todo = allTodos.find(t => t.id === id);
      if (!todo) return;
      document.getElementById("editId").value = todo.id;
      document.getElementById("editName").value = todo.task_name;
      document.getElementById("editPriority").value = todo.task_priority;
      document.getElementById("editStatus").value = todo.task_status;
      document.getElementById("editDueDate").value = todo.due_date ? todo.due_date.slice(0, 10) : "";
      new bootstrap.Modal(document.getElementById("editModal")).show();
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value;
      const body = {
        task_name: document.getElementById("editName").value,
        task_priority: document.getElementById("editPriority").value,
        task_status: document.getElementById("editStatus").value,
        due_date: document.getElementById("editDueDate").value || null,
      };
      try {
        const res = await apiFetch(`/items/${id}`, { method: "PUT", body: JSON.stringify(body) });
        if (!res.ok) throw new Error("Failed to update task");
        bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
        loadTodos();
      } catch (err) {
        alert("Error updating task. Please try again.");
        console.error(err);
      }
    });

    // --- Delete ---
    function confirmDelete(id) {
      selectedTaskIdToDelete = id;
      new bootstrap.Modal(document.getElementById("deleteModal")).show();
    }

    document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
      if (!selectedTaskIdToDelete) return;
      try {
        const response = await apiFetch(`/items/${selectedTaskIdToDelete}`, { method: "DELETE" });
        if (!response.ok) throw new Error("Failed to delete task");
        selectedTaskIdToDelete = null;
        bootstrap.Modal.getInstance(document.getElementById("deleteModal")).hide();
        loadTodos();
      } catch (error) {
        alert("Error deleting task. Please try again.");
        console.error(error);
      }
    });

    // --- helpers ---
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function getStatusIcon(status) {
      return { Completed: '<i class="fas fa-check-circle"></i>', "In Progress": '<i class="fas fa-spinner"></i>', Pending: '<i class="fas fa-clock"></i>' }[status] || '<i class="fas fa-question-circle"></i>';
    }
    function getPriorityIcon(priority) {
      return { High: '<i class="fas fa-exclamation-triangle"></i>', Medium: '<i class="fas fa-minus-circle"></i>', Low: '<i class="fas fa-arrow-down"></i>' }[priority] || '<i class="fas fa-circle"></i>';
    }
    function getStatusBadgeClass(status) {
      return { Completed: "bg-success", "In Progress": "bg-warning", Pending: "bg-secondary" }[status] || "bg-light text-dark";
    }
    function getPriorityBadgeClass(priority) {
      return { High: "bg-danger", Medium: "bg-warning", Low: "bg-success" }[priority] || "bg-light text-dark";
    }
    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }
    function updateTaskCount(count) {
      document.getElementById("task-count").innerHTML =
        `<span class="badge bg-secondary">${count} task${count !== 1 ? "s" : ""}</span>`;
    }
    function filterTodos() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const statusFilter = document.getElementById("filterStatus").value;
      let filtered = allTodos;
      if (searchTerm) filtered = filtered.filter(t => t.task_name.toLowerCase().includes(searchTerm));
      if (statusFilter !== "all") filtered = filtered.filter(t => t.task_status === statusFilter);
      displayTodos(filtered);
      updateTaskCount(filtered.length);
    }
    document.getElementById("searchInput").addEventListener("input", filterTodos);
    document.getElementById("filterStatus").addEventListener("change", filterTodos);

    // Gate the page, then load.
    Auth.requireLogin().then(loadTodos);
  </script>
</body>

</html>
