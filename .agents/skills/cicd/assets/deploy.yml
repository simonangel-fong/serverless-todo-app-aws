# Reference deploy workflow: GitHub Actions -> Terraform -> AWS (serverless).
#
# Implements the cicd skill's shape:
#   - OIDC auth (no static AWS keys)
#   - PR = plan only; push to main = plan + gated apply; dispatch = plan/apply/destroy
#   - apply the SAVED plan behind an environment approval gate
#   - Lambda packaged by Terraform's archive_file (no separate step here)
#   - frontend: inject Terraform outputs -> sync to S3 -> invalidate CloudFront
#
# Adapt names/paths (infra dir, tfvars, output names, secrets) to the project.

name: Deploy

on:
  pull_request:
    branches: [main]
    paths: [infra/**, lambda/**, web/**, .github/workflows/**]
  push:
    branches: [main]
    paths: [infra/**, lambda/**, web/**, .github/workflows/**]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

env:
  # Non-secret inputs; secrets are referenced inline below.
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_plan: ${{ steps.plan.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate
        run: terraform -chdir=infra validate

      - name: Plan
        id: plan
        run: terraform -chdir=infra plan -var-file=dev.tfvars -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  apply:
    needs: plan
    # Only on merge to main or an explicit apply dispatch.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers in repo Settings -> Environments
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Apply saved plan
        run: terraform -chdir=infra apply -auto-approve tfplan

      # --- Frontend: inject -> sync -> invalidate (order matters) ---
      - name: Inject frontend config
        run: |
          sed -i \
            -e "s|__API_BASE_URL__|$(terraform -chdir=infra output -raw api_invoke_url)|" \
            -e "s|__COGNITO_REGION__|$(terraform -chdir=infra output -raw aws_region)|" \
            -e "s|__COGNITO_POOL_ID__|$(terraform -chdir=infra output -raw cognito_user_pool_id)|" \
            -e "s|__COGNITO_CLIENT_ID__|$(terraform -chdir=infra output -raw cognito_app_client_id)|" \
            web/config.js

      - name: Sync to S3
        run: |
          aws s3 sync web/ "s3://$(terraform -chdir=infra output -raw web_bucket_id)/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform -chdir=infra output -raw cloudfront_distribution_id)" \
            --paths "/*"

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production   # gate destroys too
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Destroy
        run: terraform -chdir=infra destroy -auto-approve -var-file=dev.tfvars
